name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # Keep Python 3.8 available when ubuntu-latest moves to a newer image.
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Set up Node for preview parity tests
        # The preview parity regression executes production JavaScript against
        # Python's authoritative Decimal calculator.
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Python tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///test_ci.db
        run: pytest -v

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          for file in portfolio_app/static/js/*.js tests/*.js; do
            node --check "$file" || exit
          done
      - name: Run JavaScript assertions
        run: |
          for file in tests/*.js; do
            node "$file" || exit
          done
